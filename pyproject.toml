[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ripllo"
version = "0.1.2"
description = "Official Python SDK for Ripllo — discounts, referrals, abandoned cart, pixels, feeds, blog + creator marketplace (campaigns, programs, collaborations), marketing (channels, contacts, contact-lists, marketing campaigns, funnels, inbox, audience segments), insights, API keys, audit log, billing, integrations, uploads, profiles (merchant/creator/affiliator), KYC, disputes. Platform-partner mode for Storlaunch (Pattern 2 HMAC partner-billing)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
  "marketing",
  "discounts",
  "referrals",
  "creator-marketplace",
  "ripllo",
  "forjio",
]
authors = [{ name = "Forjio", email = "hello@ripllo.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "respx>=0.21.0",
]

[project.urls]
Homepage = "https://ripllo.com"
Source = "https://github.com/hachimi-cat/ripllo-python"
Issues = "https://github.com/hachimi-cat/ripllo-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["ripllo"]
